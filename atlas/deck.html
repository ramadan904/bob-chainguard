<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signalbox Deck</title>
    <meta name="description" content="Pitch deck: Signalbox, interlocking for parallel IBM Bob subagents. Numbers come from the real run." />
  </head>
  <body class="deck">
    <main id="slides"></main>
    <nav class="deck-nav" aria-label="Slides">
      <button id="prev" aria-label="Previous slide">←</button>
      <span id="count"></span>
      <button id="next" aria-label="Next slide">→</button>
      <a href="./index.html">Open the live panel</a>
      <button id="print">Save as PDF</button>
    </nav>
    <script type="module" src="/src/deck.js"></script>
  </body>
</html>
