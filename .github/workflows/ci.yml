name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: legacy-dapp/package-lock.json
      - run: npm ci --prefix legacy-dapp
      - run: npm test
      - run: npm run build
      # Reporting only while the migration is in progress. After Bob's cleanup step,
      # replace with `npm run guard` so new ethers/web3.js code fails CI.
      - name: chainguard scan
        run: |
          npm run -s scan
          node chainguard/bin/chainguard.js scan legacy-dapp/src --baseline reports/baseline.json --format md >> "$GITHUB_STEP_SUMMARY"
