name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Atlas scans every commit of the migration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            legacy-dapp/package-lock.json
            atlas/package-lock.json
            samples/moment-billing/package-lock.json
      - run: npm ci --prefix legacy-dapp
      - run: npm ci --prefix atlas
      - run: npm ci --prefix samples/moment-billing
      - run: npm test
      - run: npm run build --prefix legacy-dapp
      - run: npm run atlas
      # The ledger must be intact and must match git (no-op before the Bob run).
      - run: node chainguard/bin/signalbox.js audit
      # The same interlocking on a second rule pack (Moment.js -> date-fns), end to end.
      - name: prove the Moment.js pack
        run: |
          node scripts/prove-pack.mjs | tee pack.txt
          { echo '```'; cat pack.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # Bob's migration took legacy-dapp/src to 0 legacy call sites, so the guard is blocking:
      # any new ethers v5 / web3.js call fails CI. The report still goes to the summary.
      - name: chainguard guard
        run: |
          npm run -s guard
          node chainguard/bin/chainguard.js scan legacy-dapp/src --baseline reports/baseline.json --format md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas
          path: atlas/dist

  # Most hackathon machines run Windows: prove the signal box (git worktrees, junctions, cmd.exe
  # test runs, hooks) works there too.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix legacy-dapp
      - run: npm ci --prefix atlas
      - run: npm ci --prefix samples/moment-billing
      - run: npm test
      - run: npm run build
      - run: npm run atlas
      - run: node chainguard/bin/signalbox.js audit
      - run: node scripts/prove-pack.mjs
